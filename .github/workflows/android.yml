name: Construire l'APK DEO GRACIAS Santé

# À chaque mise à jour du code sur « main », GitHub construit l'application Android
# (version finale, signée) et la publie dans « Releases » : lien de téléchargement fixe
# https://github.com/deograciasclinique-sketch/sat-formateur-optimise/releases/latest/download/DEO-GRACIAS-Sante.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Préparer l'application
        run: |
          npx vite build
          npx cap sync android

      # La clé de signature (android/app/dg.keystore) est verrouillée par un mot de passe
      # gardé uniquement dans le secret GitHub DG_KEYSTORE_PASSWORD.
      - name: Construire l'APK signé
        id: apk
        working-directory: android
        env:
          DG_KEYSTORE_PASSWORD: ${{ secrets.DG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$DG_KEYSTORE_PASSWORD" ]; then
            export DG_KEYSTORE_FILE="$PWD/app/dg.keystore" DG_KEY_ALIAS=dg
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret DG_KEYSTORE_PASSWORD absent : APK de TEST seulement (non publié). Ajoutez le secret dans Settings → Secrets and variables → Actions."
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storetype PKCS12 -alias dg -keyalg RSA -keysize 2048 -validity 30 -storepass testtest -keypass testtest -dname "CN=Test" >/dev/null
            export DG_KEYSTORE_FILE="$RUNNER_TEMP/test.keystore" DG_KEYSTORE_PASSWORD=testtest DG_KEY_ALIAS=dg
            echo "publier=non" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew assembleRelease --no-daemon -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../DEO-GRACIAS-Sante.apk
          ls -la ../DEO-GRACIAS-Sante.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DEO-GRACIAS-Sante.apk
          path: DEO-GRACIAS-Sante.apk

      - name: Publier la version (lien de téléchargement)
        if: steps.apk.outputs.publier == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: DEO GRACIAS Santé v1.${{ github.run_number }}
          body: |
            Application Android officielle du Cabinet Privé de Soins DEO-GRACIAS (personnel du cabinet).
            Téléchargez **DEO-GRACIAS-Sante.apk** sur le téléphone, ouvrez-le, autorisez « installer des applications inconnues », puis Installer.
            Les nouvelles versions s'installent par-dessus l'ancienne, sans perte de données.
          files: DEO-GRACIAS-Sante.apk
          make_latest: true
